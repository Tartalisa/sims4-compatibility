<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sims 4</title>
    <style>
        #main > div {
            display: flex;
            flex-direction: row;
            gap: 10px;
            font-family: sans-serif;
        }

        .side-menu {
            width: 25%;
        }

        div.traits {
            font-size: 0.8em;
        }

        div.traits > div:hover:not(.yellow) {
            background-color: #fffadc;
            transition: background-color .2s ease-in-out;
        }

        div.traits > div:not(.yellow) {
            transition: background-color .2s ease-in-out;
        }

        #partner-traits {
            width: 33.3%;
        }

        #compatibility-results {
            width: 50%;
            text-align: center;
        }

        main {
            width: 75%;
        }

        #compatibility, .flex-common {
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            justify-content: space-evenly;
            gap: 4px;
        }

        .flex-common > div {
            border: gray 1px solid;
            cursor: pointer;
        }

        .traits.flex-common > div, .flex-common:not(.traits) > div > div {
            padding: 2px 8px;
        }

        .gray {
            background-color: lightgray;
        }

        .green {
            background-color: #8dbf7b;
        }

        .red {
            background-color: #dd8585;
        }

        .yellow {
            background-color: #ffef96;
        }

        table#history {
            border-collapse: collapse;
            border: 1px solid black;
            max-height: 150px;
        }

        table thead {
            border: 1px solid black;
        }

        table td {
            padding: 12px;
        }

        table tbody tr:nth-child(even), table thead tr {
            background-color: #DCDCDC;
        }

        table tbody tr:hover {
            background-color: #ececec;
            transition: background-color .2s ease-in-out;
        }

        table tbody tr {
            transition: background-color .2s ease-in-out;
        }

        .close-button:hover {
            cursor: pointer;
            color: #fff;
            background-color: #e06273;
            transition: background-color .2s ease-in-out;
        }

        .close-button {
            transition: background-color .2s ease-in-out;
        }

        .tab-header > .tab-name {
            background-color: #eaeaea;
        }

        .tab-header > .tab-name.selected {
            background-color: #adadad;
        }

        .tab-body > .tab {
            display: none;
        }

        .tab-body > .tab.selected {
            display: block;
        }
    </style>
</head>
<body>
<script src="mkreactor.js"></script>
<script src="data.js"></script>
<script>
    class Character {
        constructor(name, traits = []) {
            this.name = name;
            this.traits = new Set(traits);
        }

        // Метод для получения всех черт в виде массива
        getTraitsArray() {
            return Array.from(this.traits);
        }

        static fromJSON(json) {
            return new Character(json['name'], json['traits'] || [])
        }

        toJSON() {
            // Преобразует объект Info в JSON для сохранения
            return {
                'name': this.name,
                'traits': this.getTraitsArray(),
            }
        }
    }

    // Добавляем метод для загрузки данных из localStorage
    function loadCharactersFromLocalStorage(key, defaultCharacters) {
        const saved = localStorage.getItem(key);
        if (!saved) return defaultCharacters;

        try {
            return JSON.parse(saved).reduce((acc, { id, data }) => {
                acc[id] = Character.fromJSON(data);
                return acc;
            }, {});
        } catch (e) {
            console.error(`Ошибка загрузки ${key}:`, e);
            return defaultCharacters;
        }
    }

    // Добавляем метод для сохранения данных в localStorage
    function saveCharactersToLocalStorage(key, characters) {
        const serializable = Object.entries(characters).map((char) => ({
            id: char[0],
            data: char[1].toJSON(),
        }));
        localStorage.setItem(key, JSON.stringify(serializable));
    }

    // Добавляем метод для загрузки данных из json-файла
    function loadCharactersFromFile(saved, defaultCharacters) {
        if (!saved.length) return defaultCharacters;

        try {
            return saved.reduce((acc, { id, data }) => {
                acc[id] = Character.fromJSON(data);
                return acc;
            }, {});
        } catch (e) {
            console.error(`Ошибка загрузки:`, e);
            return defaultCharacters;
        }
    }

    function loadSavedCharacters(event) {
        const file = event.target.files[0] // Получаем выбранный файл

        if (file) {
            const reader = new FileReader() // Создаем FileReader для чтения файла

            // Обработчик события "load", который срабатывает после завершения чтения файла
            reader.onload = function(e) {
                const content = e.target.result; // Содержимое файла
                const data = JSON.parse(content)
                persons = loadCharactersFromFile(data.persons, {
                    0: defaultPerson,
                })
                saveCharactersToLocalStorage('persons', persons)
                partners = loadCharactersFromFile(data.partners, {
                    0: defaultPartner,
                })
                saveCharactersToLocalStorage('partners', partners)
                main.data.info.person = Object.keys(persons)[0]
                main.data.info.partner = Object.keys(partners)[0]
            };

            // Чтение файла как текста
            reader.readAsText(file);
        }
    }

    // Добавляем метод для сохранения данных в json-файл
    function saveCharactersToFile() {
        const _personsRaw = Object.entries(persons).map((char) => ({
            id: char[0],
            data: char[1].toJSON(),
        }));
        const _partnersRaw = Object.entries(partners).map((char) => ({
            id: char[0],
            data: char[1].toJSON(),
        }));

        const string = JSON.stringify({
            'persons': _personsRaw,
            'partners': _partnersRaw
        }, null, 2)
        function handler (event){
            event.clipboardData.setData('text/plain', string)
            event.preventDefault()
            document.removeEventListener('copy', handler, true)
        }

        document.addEventListener('copy', handler, true)
        document.execCommand('copy')


    }

    let defaultPerson = new Character('Персонаж', [])
    let persons = loadCharactersFromLocalStorage('persons', {
        0: defaultPerson,
    })

    let defaultPartner = new Character('Партнер', [])
    let partners = loadCharactersFromLocalStorage('partners', {
        0: defaultPartner,
    })

    class Info {
        constructor() {
            // Инициализирует данные: дефолтные персонаж и партнер и их совместимости
            this.person = Object.keys(persons)[0]
            this.partner = Object.keys(partners)[0]
            this.compatibility = {
                scores: DATA.compatibilities.map(compatibility => {
                    return {
                        name: compatibility.name,
                        personScore: 0,
                        partnerScore: 0,
                        compatibilityScore: 0
                    }
                }),
                total: 0,
                personTotal: 0,
                partnerTotal: 0
            }
            this.calcCompatibilityScore()
        }

        calcCompatibilityScore() {
            this.compatibility.total = 0
            this.compatibility.personTotal = 0
            this.compatibility.partnerTotal = 0
            this.compatibility.scores = DATA.compatibilities.map(compatibility => {
                let comp = {
                    name: compatibility.name,
                    personScore: 0,
                    partnerScore: 0,
                    compatibilityScore: 0
                }
                for (let compatibilityTrait of compatibility.values) {
                    comp.personScore +=
                        calcCompatibilityByTrait(compatibilityTrait, partners[this.partner].traits, persons[this.person].traits)
                    comp.partnerScore +=
                        calcCompatibilityByTrait(compatibilityTrait, persons[this.person].traits, partners[this.partner].traits)
                }
                this.compatibility.personTotal += comp.personScore
                this.compatibility.partnerTotal += comp.partnerScore
                comp.compatibilityScore =
                    parseInt(calcCompatibilityScore(comp.personScore, comp.partnerScore) * 10) / 10
                this.compatibility.total += comp.compatibilityScore * 10
                return comp
            })
            this.compatibility.total = Math.round(
                this.compatibility.total / Math.max(this.compatibility.scores.length, 1)
            ) / 10
        }

        static fromJSON(json) {
            // Восстанавливает объект Info из JSON (полученного, например, из localStorage)
            let info = new Info()
            info.person = json['person']
            info.partner = json['partner']
            info.compatibility = json['compatibility']
            return info
        }

        toJSON() {
            // Преобразует объект Info в JSON для сохранения
            return {
                'person': this.person,
                'partner': this.partner,
                'compatibility': Object.assign({}, this.compatibility)
            }
        }
    }

    const calcCompatibilityByTrait = (compatibility, traitsSet, otherTraitsSet) => {
        // Считает сумму весов совместимости для одной категории (trait)
        if (!otherTraitsSet.has(compatibility.value)) return 0
        return compatibility.map.map(v => traitsSet.has(v.trait) ? v.weight : 0).reduce((a, b) => a + b, 0)
    }

    const calcCompatibilityScore = (personScore, partnerScore) => {
        // Считает итоговый балл совместимости между персонажем и партнером
        let avg = (personScore + partnerScore) / 2
        let D = Math.abs(personScore - partnerScore)
        let top = 3
        let baseScore = (avg - D * 0.32) * 100 / top
        let person2partnerPenalty = Math.min(Math.sign(personScore), 0) * top
        let partner2personPenalty = Math.min(Math.sign(partnerScore), 0) * top
        return Math.round(baseScore + partner2personPenalty + person2partnerPenalty) / 10
    }

    const getClass = (num) => {
        // Определяет цвет класса для отображения (зеленый, красный, серый)
        if (num > 0) return 'green'
        if (num < 0) return 'red'
        return 'gray'
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.DATA = loadData()
        registerComponent('categories', () => {
            return {
                data: {
                    categories: []
                },
                actions: {
                    calcClassName: function (categoryValue) {
                        // Вычисляет класс (цвет) для категории
                        let sum = categoryValue['map'].reduce((p, c) => {
                            if (this.traits.has(c.trait)) p += c.weight
                            return p
                        }, 0)
                        return getClass(sum)
                    }
                }
            }
        })
        registerComponent('randoms', () => {
            return {
                data: {
                    randoms: []
                },
                actions: {
                    calcClassName: function () {
                        // Вычисляет случайный класс (цвет) для категории
                        let weight = Math.floor(Math.random() * 2) * 2 - 1
                        return getClass(weight)
                    },
                    getValue: function (category) {
                        let i = Math.floor(Math.random() * category.values.length)
                        return category.values[i]
                    }
                }
            }
        })
        registerComponent('traits', () => {
            return {
                data: {
                    selectedtraits: new Set(),
                },
                events: {
                    updatetrait: (trait) => null
                }
            }
        })
        registerComponent('comparison', () => {
            return {
                data: {
                    info: {}
                },
                actions: {},
                events: {
                    setinfo: (info) => null
                }
            }
        })
        registerComponent('categories-tab', () => {
            return {data: {info: {}}}
        })
        registerComponent('comparison-tab', () => {
            return {
                data: {
                    info: {}
                },
                events: {
                    updatecharacter: (character) => null,
                    selectpartner: (partnerId) => null
                }
            }
        })
        registerComponent('tabs', () => {
            return {
                data: {
                    info: {},
                    selectedTab: localStorage.getItem('tabName') || 'categories'
                },
                actions: {
                    setTab: function (tab) {
                        localStorage.setItem('tabName', tab)
                        this.selectedTab = tab
                    },
                    tabSelectionMode: function (tab) {
                        return (this.selectedTab === tab) ? 'selected' : ''

                    }
                },
                events: {
                    clearpartnertraits: () => null,
                    updatecharacter: (character) => null,
                    selectpartner: (characterId) => null
                }
            }
        })
        registerComponent('character-editor', () => {
            return {
                data: {
                    characters: {},     // Все персонажи
                    selectedid: null,   // Текущий выбранный персонаж
                },
                actions: {
                    clearTraits: function (events) {
                        let character = this.characters[this.selectedid]
                        character.traits.clear()
                        events.updatecharacter(character)
                    },
                    toggleTrait: function (events) {
                        return function (trait) {
                            let character = this.characters[this.selectedid]
                            if (character.traits.has(trait)) character.traits.delete(trait)
                            else character.traits.add(trait)
                            events.updatecharacter(character)
                        }
                    },
                    // установка имени персонажа
                    setName: function (events, newName) {
                        let character = this.characters[this.selectedid]
                        character.name = newName
                        events.updatecharacter(character)
                    },
                    // добавление нового персонажа
                    addCharacter: function (events) {
                        const name = prompt("Введите имя нового персонажа:")
                        if (!name) return

                        const newId = Date.now(); // Используем временную метку как ключ
                        this.characters[newId] = new Character(name, [])
                        events.selectcharacter(newId) // Обновляем выбранный персонаж
                        this.selectedid = newId
                    },
                    // удаление персонажа
                    removeCharacter: function (events) {
                        delete this.characters[this.selectedid]

                        // Выбираем первого доступного персонажа
                        const ids = Object.keys(this.characters)
                        if (ids.length === 0) {
                            // Создаем нового персонажа "New", если их нет
                            const newId = Date.now();
                            this.characters[newId] = new Character("Новый сим", [])
                            this.selectedid = newId
                        } else {
                            this.selectedid = ids[0]
                        }

                        events.selectcharacter(this.selectedid)
                    }
                },
                events: {
                    updatecharacter: (character) => null,
                    selectcharacter: (characterId) => null,
                }
            }
        })
        window.main = new Component({
            root: document.querySelector('#main'),
            data: {
                info: new Info(),
            },
            actions: {
                setInfo: function (info) {
                    this.info = Info.fromJSON(info.toJSON())
                },
                // Новый метод для установки персонажа
                setPerson: function (person) {
                    persons[this.info.person] = Character.fromJSON(person.toJSON())
                    saveCharactersToLocalStorage('persons', persons)
                    this.info.calcCompatibilityScore()
                    main.triggerRender()
                },
                setPersonId: function (personId) {
                    this.info.person = personId
                    saveCharactersToLocalStorage('persons', persons)
                    this.info.calcCompatibilityScore()
                    main.triggerRender()
                },
                // Новый метод для установки партнера
                setPartner: function (partner) {
                    partners[this.info.partner] = Character.fromJSON(partner.toJSON())
                    saveCharactersToLocalStorage('partners', partners)
                    this.info.calcCompatibilityScore()
                    main.triggerRender()
                },
                setPartnerId: function (partnerId) {
                    this.info.partner = partnerId
                    saveCharactersToLocalStorage('partners', partners)
                    this.info.calcCompatibilityScore()
                    main.triggerRender()
                },
            },
        })
        main.render()
    })
</script>
<script type="text/html" id="categories-template">
    <div @for="self.categories">
        <div>
            <div style="text-align: center"><p><b>{{loop.item.name}}</b></p></div>
            <div @for="loop.item.values">
                <div :class="{{actions.calcClassName.call(self, loop.item)}}">{{loop.item.value}}</div>
            </div>
        </div>
    </div>
</script>
<script type="text/html" id="randoms-template">
    <div @for="self.randoms">
        <div>
            <div style="text-align: center"><p><b>{{loop.item.category}}</b></p></div>
            <div :class="{{actions.calcClassName.call(self)}}">{{actions.getValue.call(self, loop.item)}}</div>
        </div>
    </div>
</script>
<script type="text/html" id="traits-template">
    <div @for="DATA.traits">
        <div @on:click="events.updatetrait(loop.item)" :class="{{self.selectedtraits.has(loop.item) ? 'yellow' : ''}}">
            <span>{{loop.item}}</span>
        </div>
    </div>
</script>
<script type="text/html" id="comparison-template">
    <div>
        <table>
            <thead>
            <tr>
                <th>Категория совместимости</th>
                <th>{{persons[self.info.person].name}}</th>
                <th>{{partners[self.info.partner].name}}</th>
            </tr>
            </thead>
            <tbody @for="self.info.compatibility.scores">
            <tr>
                <th>{{loop.item.name}} ({{loop.item.compatibilityScore}})</th>
                <td>{{loop.item.personScore}}</td>
                <td>{{loop.item.partnerScore}}</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td><b>Оценка</b></td>
                <td>{{self.info.compatibility.personTotal}}</td>
                <td>{{self.info.compatibility.partnerTotal}}</td>
            </tr>
            <tr>
                <td><b>Общая совместимость:</b></td>
                <td colspan="2">{{self.info.compatibility.total}}</td>
            </tr>
            </tfoot>
        </table>
    </div>
</script>
<script type="text/html" id="categories-tab-template">
    <div>
        <categories class="flex-common" :traits="{{persons[self.info.person].traits}}"
                    :categories="{{DATA.categories}}"></categories>
        <br>
        <randoms class="flex-common" :randoms="{{DATA.randoms}}"></randoms>
    </div>
</script>
<script type="text/html" id="comparison-tab-template">
    <div id="compatibility">
        <comparison id="compatibility-results"
                    :info="{{self.info}}"
                    @on:setinfo="{{events.setinfo}}"></comparison>
        <character-editor
                id="partner-traits"
                :characters="{{partners}}"
                :selectedid="{{self.info.partner}}"
                @on:selectcharacter="{{events.selectpartner}}"
                @on:updatecharacter="{{events.updatecharacter}}"
        ></character-editor>
    </div>
</script>
<script type="text/html" id="tabs-template">
    <div>
        <div class="tab-header flex-common">
            <h2 :class="tab-name {{actions.tabSelectionMode.call(self, 'categories')}}"
                @on:click="actions.setTab('categories')">Категории и предпочтения</h2>
            <h2 :class="tab-name {{actions.tabSelectionMode.call(self, 'compatibility')}}"
                @on:click="actions.setTab('compatibility')">
                Совместимость
            </h2>
        </div>
        <div class="tab-body">
            <div :class="tab {{actions.tabSelectionMode.call(self, 'categories')}}">
                <categories-tab :info="{{self.info}}" id="results"></categories-tab>
            </div>
            <div :class="tab {{actions.tabSelectionMode.call(self, 'compatibility')}}">
                <comparison-tab
                        :info="{{self.info}}"
                        @on:setinfo="{{events.setinfo}}"
                        @on:updatecharacter="{{events.updatecharacter}}"
                        @on:selectpartner="{{events.selectpartner}}"></comparison-tab>
            </div>
        </div>
    </div>
</script>
<script type="text/html" id="character-editor-template">
    <div>
        <select @on:change="events.selectcharacter(event.target.value)"
                @for="self.characters"
                @hold>
            <option :value="{{loop.index}}" :selected="{{loop.index == self.selectedid}}">
                {{loop.item.name}}
            </option>
        </select>
        <button @on:click="actions.addCharacter(events)">+</button>
        <button @on:click="actions.removeCharacter(events)">-</button>
        <br>
        <input type="text"
               :value="{{self.characters[self.selectedid].name}}"
               @on:input="actions.setName(events, event.target.value)"
               placeholder="Имя">
        <button @on:click="actions.clearTraits(events)">&#x2702;&#xFE0F ЧХ</button>
        <traits class="traits flex-common"
                :selectedtraits="{{self.characters[self.selectedid].traits}}"
                @on:updatetrait="{{actions.toggleTrait(events)}}"></traits>
    </div>
</script>
<script type="text/html" id="main-template">
    <div>
        <div class="side-menu">
            <h2>Черты характера
                <button @on:click="saveCharactersToFile()">⧉</button>
                <button onclick="document.querySelector('#file').click()">&#x1f4c1;</button>
                <input id="file" type="file" @on:change="loadSavedCharacters(event)" style="display: none">
            </h2>
            <character-editor
                    :characters="{{persons}}"
                    :selectedid="{{self.info.person}}"
                    @on:selectcharacter="{{actions.setPersonId}}"
                    @on:updatecharacter="{{actions.setPerson}}"
            ></character-editor>
        </div>
        <main>
            <tabs class="tab-container"
                  :info="{{self.info}}"
                  @on:updatecharacter="{{actions.setPartner}}"
                  @on:setinfo="{{actions.setInfo}}"
                  @on:selectpartner="{{actions.setPartnerId}}"></tabs>
        </main>
    </div>
</script>
<div id="main"></div>
</body>
</html>
